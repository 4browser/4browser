[package]
name = "fourbrowser"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# Storage and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
regex = "1.10"
reqwest = { version = "0.11", features = ["json"] }
url = "2.5"
once_cell = "1.19"

# Security and crypto
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"

# File system
walkdir = "2.4"
directories = "5.0"
dirs = "5.0"

# GUI
egui = "0.24"
eframe = { version = "0.24", features = ["default"] }

# Windows API
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef"] }

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "fourbrowser"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
