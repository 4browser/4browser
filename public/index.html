<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 Browser</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="browser-container">
        <!-- Header/Navigation -->
        <header class="browser-header">
            <div class="header-content">
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="browserAPI.goBack()">← Back</button>
                    <button class="nav-btn" onclick="browserAPI.goForward()">Forward →</button>
                    <button class="nav-btn" onclick="browserAPI.reload()">⟲ Reload</button>
                </div>
                
                <div class="address-bar">
                    <input type="text" id="addressInput" placeholder="Enter URL or search..." class="address-input">
                    <button class="search-btn" onclick="browserAPI.navigate()">Go</button>
                </div>

                <div class="header-icons">
                    <button class="icon-btn" onclick="openSettings()">⚙️</button>
                    <button class="icon-btn" onclick="openExtensions()">🧩</button>
                    <button class="icon-btn" onclick="openBookmarks()">⭐</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="browser-main">
            <!-- Tabs View -->
            <div class="tabs-container">
                <div id="tabsList" class="tabs-list"></div>
                <button class="new-tab-btn" onclick="browserAPI.newTab()">+ New Tab</button>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <div id="contentFrame" class="content-frame">
                    <div class="welcome-screen">
                        <div class="welcome-header">
                            <h1>🌐 4 Browser</h1>
                            <p>A powerful, customizable browser built with Rust</p>
                        </div>
                        <div class="quick-links">
                            <div class="quick-link-card">
                                <h3>Browse</h3>
                                <p>Fast and secure web browsing</p>
                            </div>
                            <div class="quick-link-card">
                                <h3>Customize</h3>
                                <p>Extensions and personalization</p>
                            </div>
                            <div class="quick-link-card">
                                <h3>Secure</h3>
                                <p>Privacy-focused permissions</p>
                            </div>
                        </div>
                        <div class="stats-display">
                            <div class="stat-item">
                                <span class="stat-label">History</span>
                                <span class="stat-value" id="historyCount">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Bookmarks</span>
                                <span class="stat-value" id="bookmarkCount">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Extensions</span>
                                <span class="stat-value" id="extensionCount">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Settings Panel -->
        <div id="settingsPanel" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="close-btn" onclick="closeSettings()">✕</button>
                </div>
                <div class="modal-body">
                    <div class="settings-section">
                        <h3>Browser Settings</h3>
                        <div class="setting-item">
                            <label>Browser Name:</label>
                            <input type="text" id="browserName" class="setting-input">
                            <button onclick="browserAPI.saveBrowserName()">Save</button>
                        </div>
                        <div class="setting-item">
                            <label>Device Name:</label>
                            <input type="text" id="deviceName" class="setting-input">
                            <button onclick="browserAPI.saveDeviceName()">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Extensions Panel -->
        <div id="extensionsPanel" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Extensions</h2>
                    <button class="close-btn" onclick="closeExtensions()">✕</button>
                </div>
                <div class="modal-body">
                    <div id="extensionsList" class="extensions-list"></div>
                </div>
            </div>
        </div>

        <!-- Bookmarks Panel -->
        <div id="bookmarksPanel" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Bookmarks</h2>
                    <button class="close-btn" onclick="closeBookmarks()">✕</button>
                </div>
                <div class="modal-body">
                    <div id="bookmarksList" class="bookmarks-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
